<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15803d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2315803d'/%3E%3Cpath d='M10 21c0-6 5-10 12-10-1 7-5 11-11 11' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>SıfırTabak · Akıllı israf takibi</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="root"><p style="font-family:system-ui;padding:40px;color:#57534e">SıfırTabak yükleniyor…</p></div>
    <script>
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && !r.dataset.ok) r.innerHTML = '<div style="font-family:system-ui;padding:40px;max-width:720px"><h2 style="color:#b91c1c">Uygulama açılamadı</h2><p>Hata: <code>' + String(e.message).replace(/</g, '&lt;') + '</code></p><p>Bu mesajın ekran görüntüsünü gönderin.</p></div>';
      });
    </script>
    <script src="./app.js" defer></script>
  </body>
</html>
